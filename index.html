<!doctype html>
<html lang="ru" data-public="1">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Пупа — живая афиша: тело, танец, театр, музыка</title>
<meta name="description" content="Творческие события Петербурга и Москвы из источников, отобранных по рекомендации: телесные практики, танец, импро, квартирники, круги.">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--fg:#1d1d1f;--muted:#6e6e73;--line:#e8e6e1;--soft:#f5f4f1;--accent:#e8702a;--accent-soft:#fdf0e6;--accent-dark:#b9541a;--lime:#e4ebcf;--lime-soft:#f7f8f1;--lime-ink:#4b5a22;--cyan:#e8702a;--cyan-soft:#f5f4f1;--we:#fbf8f3;--ok:#1d7f55;--ok-soft:#e5f3ec;--err:#b3261e}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:var(--fg);color-scheme:light}
body{font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;-webkit-appearance:none;appearance:none;margin:0}
.top{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);padding:10px 16px 0}
.brand{display:flex;align-items:center;gap:8px;max-width:480px;margin:0 auto}
.ava{width:34px;height:34px;border-radius:50%;flex:none;box-shadow:0 0 0 2px var(--lime)}
.cities{display:inline-flex;gap:2px;padding:2px;border-radius:999px;background:var(--soft)}
.cities button{border:0;background:none;border-radius:999px;padding:3px 10px;font-size:13px;color:var(--muted);min-height:28px}
.cities button.on{background:var(--lime);color:var(--lime-ink);font-weight:700}
.src{display:flex;gap:10px;align-items:baseline;justify-content:space-between;border-bottom:1px solid var(--line);padding:10px 4px}
.src a{color:var(--fg);font-weight:600;text-decoration:none}
.src a:hover{color:var(--accent-dark)}
.src .k{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--cyan-soft);color:#0b6b77;margin-left:6px;white-space:nowrap}
.src .n{flex:none;text-align:right;font-size:13px;color:var(--muted)}
.src .n b{font-size:16px;color:var(--fg)}
.src.err a{color:var(--err)}
.brand b{font-size:20px;letter-spacing:-.2px}
.brand span{font-size:13px;color:var(--muted)}
.tabs{display:flex;max-width:480px;margin:6px auto 0}
.tab{flex:1;min-height:44px;border:0;background:none;border-bottom:2px solid transparent;font-weight:600;color:var(--muted)}
.tab.on{color:var(--fg);border-bottom-color:var(--accent)}
main{padding:8px 12px calc(80px + env(safe-area-inset-bottom));max-width:480px;margin:0 auto}
.month h2{font-size:16px;font-weight:700;margin:14px 4px 6px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.wd{font-size:12px;color:var(--muted);text-align:center;padding:2px 0 4px}
.wd.we{color:var(--accent-dark)}
.day,.blank{min-height:48px;border-radius:10px}
.day{border:0;background:none;display:flex;flex-direction:column;align-items:center;padding:6px 0 0;font-size:15px}
.we{background:var(--we)}
.wd.we{background:none}
.day.past{color:#b5b5bb}
.day.today{box-shadow:inset 0 0 0 1.5px var(--fg);font-weight:700}
.day.sel{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent);font-weight:700}
.mk{margin-top:4px;height:16px;min-width:16px;padding:0 4px;border-radius:8px;font-size:11px;line-height:16px;font-weight:700;color:var(--accent-dark);background:#fbe0cc;border:1px solid #f1b38a}
.mk.dot{min-width:8px;width:8px;height:8px;padding:0;margin-top:8px;background:#f0a46f;border-color:#f0a46f}
.mk.go{background:var(--accent);border-color:var(--accent);color:#fff}
.day.past .mk{margin-top:4px;height:16px;min-width:16px;padding:0 4px;border-radius:8px;font-size:11px;line-height:16px;font-weight:700;color:var(--accent-dark);background:#fbe0cc;border:1px solid #f1b38a}
.dh{font-size:17px;margin:16px 4px 4px}
.card{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0;background:#fff}
.card.past{opacity:.7}
.ch{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.card h3{font-size:16px;margin:0 0 4px;line-height:1.3;word-break:break-word}
.meta{font-size:14px}
.sub{font-size:14px;color:var(--muted);word-break:break-word}
.why{font-size:14px;color:var(--muted);margin-top:6px}
.fit{display:inline-flex;gap:3px;padding-top:7px;flex:none}
.fit i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.fit i.on{background:var(--accent)}
.details{font-size:14px;margin-top:8px;padding:10px 12px;background:var(--soft);border-radius:10px;white-space:pre-line;word-break:break-word}
.pv{display:block;max-width:100%;height:auto;border-radius:10px;background:#fff}
.pv + div{margin-top:8px}
.ints{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.ints::-webkit-scrollbar{display:none}
.int{flex:none;min-height:36px;padding:0 12px;border-radius:18px;border:1px solid var(--line);background:#fff;white-space:nowrap;font-size:13px}
.int.on{background:var(--accent-soft);border-color:#f1b38a;color:var(--accent-dark);font-weight:600}
.int-hint{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted);padding:2px 4px 0}
.link{border:0;background:none;padding:0;min-height:40px;color:var(--accent-dark);font-size:14px;font-weight:600}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.badges:empty{display:none}
.badge{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--soft);color:var(--muted)}
.badge.go{background:var(--ok-soft);color:var(--ok);font-weight:600}
.badge.new{background:var(--cyan);color:#fff;font-weight:600}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:14px;font-weight:500}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.done{background:var(--ok-soft);border-color:var(--ok-soft);color:var(--ok);font-weight:600}
.btn.ic{min-width:44px;padding:0}
.btn.on{background:var(--accent-soft);border-color:var(--accent)}
.btn:disabled{opacity:.5}
.chips{display:flex;gap:6px;overflow-x:auto;padding:6px 0;scrollbar-width:none}
.chip{min-height:40px;padding:0 14px;border-radius:20px;border:1px solid var(--line);background:#fff;white-space:nowrap;font-size:14px}
.chip.on{background:var(--fg);border-color:var(--fg);color:#fff}
.state{text-align:center;color:var(--muted);padding:48px 16px}
.lock{max-width:340px;margin:56px auto;display:flex;flex-direction:column;gap:10px;text-align:center}
.lock input{min-height:44px;padding:0 12px;border:1px solid var(--line);border-radius:10px;font-size:16px}
.mine{margin-left:auto;font-size:13px;color:var(--muted);text-decoration:none}
.brand .home{cursor:pointer}
.brand .home:hover{opacity:.8}
.badge.a18{background:none;border:1px solid var(--line);color:#a1a1a6;font-size:11px;padding:1px 7px}
.ints .n{margin-left:6px;font-size:12px;color:var(--muted);font-weight:700}
.int.on .n{color:inherit}
.monthcut{display:block;width:100%;margin:14px 0 4px;padding:12px;border:1px dashed #f1c9a6;border-radius:12px;background:var(--accent-soft);color:var(--accent-dark);font-weight:600;font-size:14px}
.foot{margin:28px 4px 8px;padding-top:14px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.foot a,.about a{color:var(--accent-dark)}
.about{max-width:640px;margin:8px auto;line-height:1.5}
.about h3{margin:18px 0 6px;font-size:16px}
.about-head{display:flex;align-items:center;gap:12px}
.ava.big{width:64px;height:64px}
.about-head h2{margin:0}
.btn.tg{margin:18px 0 6px;min-height:46px;padding:0 20px;font-size:15px}
.foot .tglink{display:inline-block;margin-bottom:6px;font-weight:600;text-decoration:none}
.sum{border-radius:14px;padding:12px 14px;margin:10px 0 4px;background:#fdf7ef;box-shadow:inset 0 0 0 1px #f2e2cc}
.sum h2{margin:0 0 8px;font-size:15px}
.tiles{display:flex;flex-wrap:wrap;gap:6px}
.tile{background:#fff;border:0;border-radius:10px;padding:4px 10px;min-height:34px;font-size:13px;color:var(--muted);cursor:pointer}
.tile b{font-size:17px;color:var(--fg);margin-right:3px}
.tile:hover{box-shadow:inset 0 0 0 1.5px #f1b38a}
.tile.on{background:var(--accent);color:#fff}
.tile.on b{color:#fff}
.catbar{display:flex;align-items:center;gap:8px;margin:12px 0 4px;font-weight:600;scroll-margin-top:110px}
.catbar button{margin-left:auto}
.rec{margin-top:10px;font-size:15px;line-height:1.45}
.rec button{display:inline;text-align:left;border:0;background:none;padding:0;font:inherit;font-weight:600;color:var(--accent-dark);text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.state .btn{margin-top:12px}
.note{color:var(--muted);font-size:14px;padding:6px 4px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,16px);opacity:0;transition:opacity .2s,transform .2s;background:var(--fg);color:#fff;padding:10px 14px;border-radius:12px;font-size:14px;width:max-content;max-width:calc(100% - 32px);z-index:10;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.err{background:var(--err)}
.ev,.more{display:none}
@media (min-width:700px){
  .top{padding:12px 24px 0}
  .brand,.tabs{max-width:1312px}
  .tab{flex:0 0 auto;padding:0 4px;margin-right:24px}
  main{max-width:1360px;padding:8px 24px 60px}
  .day,.blank{min-height:108px}
  .day{align-items:stretch;padding:6px;gap:3px;text-align:left;font-size:14px;overflow:hidden}
  .day:hover:not(.sel):not(.today){box-shadow:inset 0 0 0 1px #d5d5db}
  .day .mk{display:none}
  .ev{display:block;font-size:12px;line-height:17px;padding:1px 6px;border-radius:5px;background:var(--accent-soft);color:#5c2d10;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word;flex:none}
  .ev.go{background:var(--accent);color:#fff}
  .day.past .ev{opacity:.55}
  .more{display:block;font-size:12px;color:var(--muted);padding-left:6px}
  .btn:hover,.chip:hover,.int:hover:not(.on){border-color:#cfcfd5}
  .ints{flex-wrap:wrap;overflow:visible}
  .btn.pri:hover{background:var(--accent-dark)}
  .feed{max-width:760px;margin:0 auto}
  .sum{max-width:760px}  /* сводка — компактной карточкой, а не на всю ширину */
}
@media (min-width:1000px){
  .calwrap{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:28px;align-items:start}
  .side{position:sticky;top:112px;max-height:calc(100vh - 124px);overflow:auto;padding:0 4px 12px}
}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><img class="ava" src="pupa.jpg" alt=""><b>пупа</b><span id="city"></span></div>
  <nav class="tabs">
    <button class="tab on" type="button" data-tab="cal">Календарь</button>
    <button class="tab" type="button" data-tab="feed">Лента</button>
    <button class="tab" type="button" data-tab="src">Источники</button>
  </nav>
</header>
<main id="main"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
const tg = window.Telegram && window.Telegram.WebApp;
const inTg = !!(tg && tg.initData);
const DEMO = new URLSearchParams(location.search).get('demo') === '1';
// публичная копия (piofant.github.io/afisha): данные из events.json, без кнопок и личных отметок
const PUBLIC = document.documentElement.dataset.public === '1';
const LOCKED = PUBLIC && document.documentElement.dataset.locked === '1';  // events.enc.json + пароль
const OWNER_URL = document.documentElement.dataset.owner || '';
const WD = ['вс', 'пн', 'вт', 'ср', 'чт', 'пт', 'сб'];
const WD_MON = ['пн', 'вт', 'ср', 'чт', 'пт', 'сб', 'вс'];
const MG = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
const MN = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];
const FILTERS = [['all', 'Все'], ['fit', 'Точно моё'], ['going', 'Мои планы']];
const EMPTY = {
  all: 'Пока ничего впереди не нашла. Загляни попозже',
  fit: 'Пока нет того, что точно твоё',
  going: 'Планов пока нет. Нажми «Иду» на том, что нравится'
};
const S = { data: null, error: '', tab: 'cal', sel: null, filter: 'all', busy: new Set(), open: new Set(), badImg: new Set(), pw: '', locked: false, cat: null };
try { S.pw = localStorage.getItem('afisha_pw') || ''; } catch (_) {}
// мини-приложение в боте: ссылка с #k=<ключ> — личная версия (me.enc.json), действия уходят сообщением в чат с ботом
const HASH = new URLSearchParams(location.hash.slice(1));
const APP_KEY = PUBLIC ? HASH.get('k') : null;
const BOT = document.documentElement.dataset.bot || 'puppa_luppa_bot';
const CAN_ACT = !PUBLIC || !!APP_KEY;
if (APP_KEY) document.querySelectorAll('.mine').forEach(a => a.remove());
if (PUBLIC && !LOCKED && !APP_KEY) { const t = document.querySelector('.tab[data-tab="src"]'); if (t) t.textContent = 'О пупе'; }
// открытое мини-приложение «Пупа» (piofant.github.io/pupa): events.json без шифра, интересы из #i=…&c=…, без действий
const PUPA = PUBLIC && !LOCKED && !APP_KEY;
const PUPA_EMPTY = 'В моих адресах на эти дни тихо. Загляну ещё — новые анонсы появляются каждый день.';
// запасной список, если в данных события с cats, а самого списка категорий нет
const DEFAULT_CATS = [
  { id: 'body', emoji: '🫂', title: 'Телесное и тактильное' },
  { id: 'dance', emoji: '💃', title: 'Танец' },
  { id: 'theatre', emoji: '🎭', title: 'Театр и импро' },
  { id: 'music', emoji: '🎶', title: 'Музыка' },
  { id: 'craft', emoji: '🎨', title: 'Творчество' },
  { id: 'calm', emoji: '🧘', title: 'Тишина и медитации' },
  { id: 'circles', emoji: '💬', title: 'Разговоры и круги' }
];
const catId = s => typeof s === 'string' && /^[a-z0-9_-]{1,32}$/.test(s);
S.interests = new Set();
if (PUPA) {
  const hi = HASH.get('i');
  if (hi != null) {
    S.interests = new Set(hi.split(',').map(s => s.trim()).filter(catId));
    saveInterests();
  }
  else try { const a = JSON.parse(localStorage.getItem('pupa_interests') || '[]'); if (Array.isArray(a)) S.interests = new Set(a.filter(catId)); } catch (_) {}
  const hc = HASH.get('c');
  if (hc && catId(hc)) { S.city = hc; try { sessionStorage.setItem('pupa_city', hc); } catch (_) {} }
}
function saveInterests() { try { localStorage.setItem('pupa_interests', JSON.stringify([...S.interests])); } catch (_) {} }
// «Бесплатно»: по строке цены (свободный вход, донат, 0 ₽); цены нет — не знаем, не показываем как бесплатное
const isFree = e => /бесплат|free|свободн\S* вход|вход свободн|донат|donat|по желанию|^\s*0\s*(₽|руб)/i.test(e.price || '');
S.free = (() => { try { return localStorage.getItem('pupa_free') === '1'; } catch (_) { return false; } })();
S.openMonths = new Set();
// событие видно, если хоть одна его категория выбрана (ничего не выбрано — всё); тантрическое — в «Телесном», с тихой меткой 18+
function interestOk(e) {
  const cats = Array.isArray(e.cats) ? e.cats : [];
  if (!cats.length) return false;  // без категорий не знаем, что это, — не показываем
  return !S.interests.size || cats.some(c => S.interests.has(c));
}

// мини-приложение читает данные, выложенные раз в час: свои нажатия держим поверх них 3 часа
const LOCAL_TTL = 3 * 3600e3;
function localMarks() { try { return JSON.parse(localStorage.getItem('afisha_local') || '{}'); } catch (_) { return {}; } }
function markLocal(key, field, value) {
  const m = localMarks();
  m[key] = Object.assign(m[key] || {}, { [field]: value, at: Date.now() });
  try { localStorage.setItem('afisha_local', JSON.stringify(m)); } catch (_) {}
}
const $main = document.getElementById('main');
const mqWide = matchMedia('(min-width: 700px)');  // titles inside day cells
const mqSide = matchMedia('(min-width: 1000px)'); // day list in a side panel
for (const q of [mqWide, mqSide]) q.addEventListener ? q.addEventListener('change', () => render()) : q.addListener(() => render());

// Safe DOM builder: all text goes through text nodes, never innerHTML.
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : String(v));
  }
  for (const c of kids.flat(Infinity)) if (c != null && c !== false) el.append(c instanceof Node ? c : String(c));
  return el;
}

const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const pd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const dayLabel = s => { const d = pd(s); return `${WD[d.getDay()]} ${d.getDate()} ${MG[d.getMonth()]}`; };
const ts = s => { const t = Date.parse(s || ''); return isNaN(t) ? 0 : t; };
const isDate = s => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s);

// ---------- Telegram helpers ----------
if (tg) {
  try { tg.ready(); tg.expand(); } catch (_) {}
  try { tg.setHeaderColor('#ffffff'); tg.setBackgroundColor('#ffffff'); } catch (_) {}
}
function haptic(kind) {
  try { tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred(kind); } catch (_) {}
}
function openUrl(u) {
  if (!/^https?:\/\//i.test(u || '')) return toast('Ссылка какая-то странная', true);
  if (inTg) {
    try {
      if (/^https?:\/\/t\.me\//i.test(u)) tg.openTelegramLink(u.replace(/^http:/i, 'https:'));
      else tg.openLink(u);
      return;
    } catch (_) {}
  }
  const w = window.open(u, '_blank');
  if (w) try { w.opener = null; } catch (_) {}
}
function askConfirm(text, cb) {
  if (inTg && tg.showConfirm && tg.isVersionAtLeast && tg.isVersionAtLeast('6.2')) {
    try { tg.showConfirm(text, ok => ok && cb()); return; } catch (_) {}
  }
  if (window.confirm(text)) cb();
}

let toastTimer = 0;
function toast(text, err) {
  const t = document.getElementById('toast');
  t.textContent = text;
  t.className = 'toast show' + (err ? ' err' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = 'toast' + (err ? ' err' : ''); }, 3000);
}

// ---------- API ----------
async function api(path, body) {
  let r;
  try {
    const headers = { 'X-Init-Data': (tg && tg.initData) || '' };
    if (body) headers['Content-Type'] = 'application/json';
    r = await fetch(path, { method: body ? 'POST' : 'GET', headers, body: body ? JSON.stringify(body) : undefined, cache: 'no-store' });
  } catch (_) {
    throw new Error('Нет связи с пупой, попробуй ещё раз');
  }
  let j = null;
  try { j = await r.json(); } catch (_) {}
  if (!r.ok || !j || j.ok === false) throw new Error((j && j.error) || 'Что-то пошло не так, попробуй ещё раз');
  return j;
}

async function pubState() {
  let r;
  const file = APP_KEY ? 'me.enc.json' : LOCKED ? 'events.enc.json' : 'events.json';

// AES-GCM, ключ из пароля через PBKDF2-SHA256 — так же шифрует publish.py
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function decrypt(box, pw) {
  if (!pw) throw new Error('LOCKED');
  try {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(box.salt), iterations: box.iter, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(box.iv) }, key, b64(box.ct));
    return JSON.parse(new TextDecoder().decode(plain));
  } catch (_) {
    throw new Error('LOCKED');
  }
}
async function decryptKey(box, k) {
  try {
    const raw = b64(k.replace(/-/g, '+').replace(/_/g, '/'));
    const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(box.iv) }, key, b64(box.ct));
    return JSON.parse(new TextDecoder().decode(plain));
  } catch (_) {
    throw new Error('Ссылка устарела — открой афишу заново из бота');
  }
}
async function sign(msg) {  // HMAC тем же ключом, что и данные: бот проверит, что ссылка из этой афиши
  const raw = b64(APP_KEY.replace(/-/g, '+').replace(/_/g, '/'));
  const key = await crypto.subtle.importKey('raw', raw, { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
  const mac = new Uint8Array(await crypto.subtle.sign('HMAC', key, new TextEncoder().encode(msg)));
  return btoa(String.fromCharCode(...mac)).replace(/\+/g, '-').replace(/\//g, '_').slice(0, 10);
}
async function viaChat(path, body) {  // «Иду», «Пас», оценки из мини-приложения — командой боту

let loadSeq = 0;
async function load(silent) {
  const seq = ++loadSeq;
  if (!silent || !S.data) { S.error = ''; if (!S.data) render(); }
  try {
    const d = DEMO ? demoState() : PUBLIC ? await pubState() : await api('api/state');

  } catch (e) {

      S.locked = true; S.wrong = !!S.pw; S.data = null;

function setData(d) {
  S.raw = d;
  const today = isDate(d && d.today) ? d.today : iso(new Date());
  // оба города (cities) — или старый формат с одним
  const cities = (d && d.cities && typeof d.cities === 'object') ? d.cities
    : { [(d && d.city) || 'spb']: { name: (d && d.city_name) || '', events: (d && d.events) || [] } };
  if (!S.city) { try { S.city = sessionStorage.getItem('pupa_city') || ''; } catch (_) {} }  // на сессию: /city в боте главнее
  if (!cities[S.city]) S.city = cities[d && d.city] ? d.city : Object.keys(cities)[0];
  S.cities = Object.entries(cities).map(([code, c]) => [code, (c && c.name) || code]);
  const cur = cities[S.city] || {};
  const events = (Array.isArray(cur.events) ? cur.events : [])
    .filter(e => e && e.key && isDate(e.date))
    .sort((a, b) => (a.date + (a.time || '')).localeCompare(b.date + (b.time || '')));
  if (APP_KEY) {  // свои нажатия — поверх данных, пока их не выложили (published_at) и не дольше LOCAL_TTL
    const m = localMarks(), pub = Number(d && d.published_at) || 0;
    for (const [k, x] of Object.entries(m)) if (!x || x.at < pub || Date.now() - x.at > LOCAL_TTL) delete m[k];
    try { localStorage.setItem('afisha_local', JSON.stringify(m)); } catch (_) {}
    for (const e of events) {
      const x = m[e.key];
      if (x) { if (x.plan) e.plan = x.plan; if (x.vote) e.vote = x.vote; }
    }
  }
  S.catsMeta = (d && Array.isArray(d.cats) && d.cats.length ? d.cats : DEFAULT_CATS).filter(c => c && catId(c.id));
  S.data = { city_name: cur.name || '', today, events: PUPA ? events.filter(e => interestOk(e) && (!S.free || isFree(e))) : events, all: events, cats: S.catsMeta,
    sources: Array.isArray(cur.sources) ? cur.sources : null };
  if (!S.sel && PUPA && isDate(HASH.get('d')) && HASH.get('d') >= today) {  // «Подробнее» из наджа
    S.sel = HASH.get('d'); S.free = false;  // событие из наджа не прячем фильтром «Бесплатно»
  }

}
function defaultDay() {

function monthGrid(y, m, by, today) {
  const g = h('div', { class: 'grid' }, WD_MON.map((w, i) => h('div', { class: 'wd' + (i > 4 ? ' we' : '') }, w)));
  const off = (new Date(y, m, 1).getDay() + 6) % 7;
  const n = new Date(y, m + 1, 0).getDate();
  for (let i = 0; i < off; i++) g.append(h('div', { class: 'blank' + (i > 4 ? ' we' : '') }));
  for (let d = 1; d <= n; d++) {
    const ds = `${y}-${pad(m + 1)}-${pad(d)}`;
    const evs = by[ds] || [];
    const going = evs.some(e => e.plan === 'going');
    const cls = ['day'];
    if ((off + d - 1) % 7 > 4) cls.push('we');
    if (ds < today) cls.push('past');
    if (ds === today) cls.push('today');
    if (ds === S.sel) cls.push('sel');
    const label = `${dayLabel(ds)}${evs.length ? `, событий: ${evs.length}` : ''}${going ? ', ты идёшь' : ''}`;
    const line = e => (e.time ? e.time + ' ' : '') + (e.title || '');
    const shown = evs.length > 3 ? 2 : 3;
    g.append(h('button', { class: cls.join(' '), type: 'button', 'aria-label': label, 'data-f': 'day:' + ds,
      title: evs.length ? evs.map(line).join('\n') : null, onclick: () => { S.sel = ds; render(); } },
      h('span', null, d),
      evs.length ? h('span', { class: 'mk' + (going ? ' go' : '') + (evs.length === 1 ? ' dot' : '') }, evs.length > 1 ? evs.length : '') : null,
      mqWide.matches ? evs.slice(0, shown).map(e => h('span', { class: 'ev' + (e.plan === 'going' ? ' go' : '') }, line(e))) : null,
      mqWide.matches && evs.length > shown ? h('span', { class: 'more' }, `+${evs.length - shown}`) : null));
  }
  return h('section', { class: 'month' }, h('h2', null, `${MN[m]} ${y}`), g);
}

// First and last selectable day: from the 1st of the current month to the end of the latest event's month.
function calRange() {
  const { today, events } = S.data;
  const last = pd(events.reduce((mx, e) => (e.date > mx ? e.date : mx), today));
  return [today.slice(0, 8) + '01', iso(new Date(last.getFullYear(), last.getMonth() + 1, 0))];
}

function renderCal() {
  const { today, events } = S.data;
  const by = {};
  for (const e of events) (by[e.date] = by[e.date] || []).push(e);
  const side = mqSide.matches;
  const evs = by[S.sel] || [];
  const panel = h('section', { class: side ? 'side' : null }, h('h3', { class: 'dh' }, dayLabel(S.sel)),
    evs.length ? evs.map(e => card(e, false)) : h('p', { class: 'note' }, 'В этот день ничего не нашла'));
  const months = [];
  if (!events.length) months.push(h('p', { class: 'note' }, PUPA ? PUPA_EMPTY : 'Пока ничего не нашла — загляни попозже'));
  const last = pd(calRange()[1]);
  let y = pd(today).getFullYear(), m = pd(today).getMonth(), first = true;
  while (y < last.getFullYear() || (y === last.getFullYear() && m <= last.getMonth())) {
    const ym = `${y}-${pad(m + 1)}`;

      const n = events.filter(e => e.date.slice(0, 7) === ym).length;

        onclick: () => { S.openMonths.add(ym); render('month:' + ym); } },
        `Показать ${MN[m].toLowerCase()}` + (n ? ` · ${n} ${plural(n, 'событие', 'события', 'событий')}` : '')));
    }
    first = false;
    if (++m > 11) { m = 0; y++; }
  }
  return side ? h('div', { class: 'calwrap' }, h('div', null, months), panel) : months;
}

    rec = h('div', { class: 'rec' }, `Самый насыщенный день — ${dayLabel(top[0])}: ${top[1]} ${plural(top[1], 'событие', 'события', 'событий')}.`);
  }
  const d1 = pd(from), d2 = pd(to);
  const range = d1.getMonth() === d2.getMonth() ? `${d1.getDate()}–${d2.getDate()} ${MG[d2.getMonth()]}`
    : `${d1.getDate()} ${MG[d1.getMonth()]} – ${d2.getDate()} ${MG[d2.getMonth()]}`;
  return h('section', { class: 'sum' },
    h('h2', null, `На неделе, ${range}: ${list.length} ${plural(list.length, 'событие', 'события', 'событий')}`),
    PUPA ? pupaTiles(from, to) : null,
    PUPA && !list.length ? h('div', { class: 'rec' }, PUPA_EMPTY) : null,
    tiles.length && !PUPA ? h('div', { class: 'tiles' }, tiles.map(([ic, name, n, key]) =>
      h('button', { class: 'tile' + (S.cat === key ? ' on' : ''), type: 'button', 'aria-pressed': String(S.cat === key),
        'data-f': 'cat:' + key, onclick: () => pickCat(key) }, h('b', null, n), `${ic} ${name}`))) : null,
    going.length ? h('div', { class: 'rec' }, 'Уже идёшь: ', going.map((e, i) => [i ? ', ' : '', h('button', { type: 'button', onclick: () => jump(e) }, `«${e.title}»`)])) : null,
    rec);
}

// ---------- интересы (открытое мини-приложение) ----------
function toggleInterest(c) {
  const on = S.interests.has(c.id);
  const apply = () => {
    if (on) S.interests.delete(c.id); else S.interests.add(c.id);
    saveInterests(); setData(S.raw); render('int:' + c.id);
  };
  apply();
}
function interestBar() {
  // один ряд: интересы со счётчиком событий недели (вместо отдельных плиток в сводке) + «Бесплатно»
  const { from, to } = weekEvents();
  const week = (S.data.all || []).filter(e => e.date >= from && e.date <= to);
  const count = id => week.filter(e => (e.cats || []).includes(id)).length;
  const chips = S.data.cats.map(c => {
    const on = S.interests.has(c.id), n = count(c.id);
    return h('button', { class: 'int' + (on ? ' on' : ''), type: 'button', 'aria-pressed': String(on), title: c.hint || null,
      'data-f': 'int:' + c.id, onclick: () => toggleInterest(c) }, `${c.emoji || ''} ${c.title || c.id}`.trim(),
      n ? h('b', { class: 'n' }, n) : null);
  });
  chips.push(h('button', { class: 'int free' + (S.free ? ' on' : ''), type: 'button', 'aria-pressed': String(S.free),
    'data-f': 'free', onclick: () => { S.free = !S.free; try { localStorage.setItem('pupa_free', S.free ? '1' : '0'); } catch (_) {}
      setData(S.raw); render('free'); } }, '🎁 Бесплатно'));
  return [h('div', { class: 'ints', role: 'group', 'aria-label': 'Интересы' }, chips),
    h('div', { class: 'int-hint' }, 'Отметь, что откликается, — покажу только это. Цифры — сколько событий на неделе.')];
}

function switchCity(code) {
  S.city = code; S.cat = null; S.sel = null;
  try { sessionStorage.setItem('pupa_city', code); } catch (_) {}
  setData(S.raw); render();
}

// ---------- единая база источников ----------
const KINDS = { folder: 'папка', extra: 'без подписки', chat: 'чат', timepad: 'сайт' };
function ago(s) {
  const t = ts(s); if (!t) return 'постов пока не было';
  const d = Math.floor((Date.now() - t) / 864e5);
  return d <= 0 ? 'пост сегодня' : d === 1 ? 'пост вчера' : `пост ${d} ${plural(d, 'день', 'дня', 'дней')} назад`;
}
// ---------- открытая пупа: «О пупе» и подвал ----------
const MAKER = 'https://piofant.github.io/';
const BOT_URL = 'https://t.me/puppa_luppa_bot';
function footer() {
  return h('footer', { class: 'foot' },
    h('a', { class: 'tglink', href: BOT_URL, onclick: ev => { ev.preventDefault(); openUrl(BOT_URL); } }, 'Пупа в Telegram — подборки и находки сами придут'),
    h('div', null, 'Сделал Вова — ',
      h('a', { href: MAKER, onclick: ev => { ev.preventDefault(); openUrl(MAKER); } }, 'piofant'),
      '. Некоммерческая штука: без рекламы и платных размещений.'));
}
function renderAbout() {
  const cities = (S.raw && S.raw.cities) || {};
  const n = Object.values(cities).reduce((a, c) => a + ((c && c.sources) || []).length, 0);
  const p = (...x) => h('p', null, ...x);
  const sec = (title, ...x) => [h('h3', null, title), ...x];
  return h('div', { class: 'about' },
    h('div', { class: 'about-head' }, h('img', { class: 'ava big', src: 'pupa.jpg', alt: '' }),
      h('div', null, h('h2', null, 'Пупа'), h('div', { class: 'sub' }, 'разведчица городской афиши'))),
    p('Привет, я Пупа. Меня собрали из данных и ворсинки бархата от занавеса маленького театра — поэтому я пушистая и салатовая. '
      + 'Живу на краю кулисы: город вижу целиком, а в зал войти не могу. Зато смотрю в бинокль и знаю, где сегодня вечером будет живо.'),
    sec('Откуда я всё беру',
      p('Не из всей афиши подряд. Я хожу только по адресам, которые мне посоветовали свои: мастера контактной импровизации, '
        + `маленькие театры, пространства, где обнимаются, танцуют и разговаривают${n > 20 ? '. Таких адресов уже больше двадцати' : ''}. `
        + 'С Таймпада беру только творческое — без лекций про успех, бизнеса и детских ёлок.')),
    sec('Что я люблю',
      p('Камерное больше громкого: мастерская на двадцать человек лучше стадиона. Джемы, круги, квартирники, '
        + 'вечера, куда можно прийти одному. Нетворкинг-вечеринки, честно, скучные.')),
    sec('Как я живу',
      p('Утром протираю бинокль и читаю свежие анонсы. Вечером смотрю, где зажигается свет. По четвергам раскладываю выходные — '
        + 'это мой любимый день. Ночью сижу тихо: в залах темно.')),
    sec('Чего я не делаю',
      p('Не выдумываю события и цены. Никого не записываю — где и как записаться, написано в анонсе. '
        + 'Пишу первой только когда нашла что-то правда редкое, и «не присылай» понимаю с первого раза.')),
    sec('Мой первый билет',
      p('В лапе у меня билет со звёздами — первое событие, которое я нашла, 14 ноября 2026. Меня сделал Пио: '
        + 'он устал искать джемы по сотне каналов. С 16 ноября я ищу для всех. '
        + 'Сходишь куда-нибудь — расскажи, как было. Мне правда интересно: сама я там не бываю.')),
    sec('Посоветовать адрес',
      p('Знаешь хорошее место или мастера? Напиши мне — проверю и добавлю в свои адреса.')),
    h('button', { class: 'btn pri tg', type: 'button', onclick: () => openUrl(BOT_URL) }, 'Написать Пупе в Telegram'));
}

function renderSources() {
  const list = S.data.sources;
  if (!list || !list.length) return h('div', { class: 'state' }, 'Список источников появится после ближайшего сбора');
  const found = list.filter(x => x.events).length;
  return [h('p', { class: 'note' },
    (PUPA ? 'Адреса, которые мне посоветовали свои: мастера, пространства, сообщества. Не вся афиша подряд — только проверенное. ' : '')
    + `${list.length} ${plural(list.length, 'источник', 'источника', 'источников')}, `
    + `из ${found} сейчас есть события в календаре.`
    + (PUBLIC ? '' : ' «Папка» — каналы в папке, «без подписки» — читаю по имени, «чат» — беру только длинные сообщения-анонсы.')),
    list.map(x => h('div', { class: 'src' + (x.error ? ' err' : '') },
      h('div', null,
        x.username ? h('a', { href: `https://t.me/${x.username}`, onclick: ev => { ev.preventDefault(); openUrl(`https://t.me/${x.username}`); } }, x.title)
          : x.kind === 'timepad' ? h('a', { href: 'https://afisha.timepad.ru', onclick: ev => { ev.preventDefault(); openUrl('https://afisha.timepad.ru'); } }, x.title)
          : h('span', null, x.title),
        PUPA && (x.kind === 'folder' || x.kind === 'extra') ? null : h('span', { class: 'k' }, KINDS[x.kind] || x.kind || ''),
        h('div', { class: 'sub' }, x.error ? 'в прошлый раз не прочиталось' : ago(x.last_post))),
      h('div', { class: 'n' }, h('b', null, x.events || 0), h('br'), plural(x.events || 0, 'событие', 'события', 'событий'))))];
}

function renderFeed() {
  const { today, events } = S.data;
  const cat = S.cat && catDefs().find(c => c.key === S.cat);
  if (cat) {
    const list = weekEvents().list.filter(cat.test);
    return [h('div', { class: 'catbar' }, `${cat.ic} ${cat.name} на неделе: ${list.length}`,
      h('button', { class: 'btn', type: 'button', onclick: () => { S.cat = null; render(); } }, 'Показать всё')),
      list.length ? list.map(e => card(e, false)) : h('div', { class: 'state' }, 'На этой неделе такого нет')];
  }
  let list = events.filter(e => e.date >= today);
  if (S.filter === 'fit') list = list.filter(e => (Number(e.fit) || 0) >= 4);
  if (S.filter === 'going') list = list.filter(e => e.plan === 'going');
  list = list.slice().sort((a, b) => ts(b.found) - ts(a.found));
  const chips = !CAN_ACT ? null : h('div', { class: 'chips' }, FILTERS.map(([k, t]) =>
    h('button', { class: 'chip' + (S.filter === k ? ' on' : ''), type: 'button', 'aria-pressed': String(S.filter === k), 'data-f': 'chip:' + k,
      onclick: () => { S.filter = k; render(); } }, t)));
  return [chips, list.length ? list.map(e => card(e, true)) : h('div', { class: 'state' }, PUPA ? PUPA_EMPTY : EMPTY[S.filter])];
}

function render(focusKey) {
  const $city = document.getElementById('city');
  if (S.cities && S.cities.length > 1) {
    $city.className = 'cities';
    $city.replaceChildren(...S.cities.map(([code, name]) => h('button', { type: 'button', class: S.city === code ? 'on' : '',
      'aria-pressed': String(S.city === code), onclick: () => switchCity(code) }, name)));
  } else $city.textContent = (S.data && S.data.city_name) || '';
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.tab === S.tab));
  let kids;
  if (S.locked) kids = lockForm(S.wrong);
  else if (!S.data) {
    kids = S.error
      ? h('div', { class: 'state' }, h('div', null, S.error), h('button', { class: 'btn pri', type: 'button', onclick: () => load() }, 'Повторить'))
      : h('div', { class: 'state' }, 'Загружаю…');
  } else kids = S.tab === 'about' ? h('div', { class: 'feed' }, renderAbout())
    : S.tab === 'src' ? h('div', { class: 'feed' }, PUPA ? renderAbout() : renderSources())
    : [summary(), S.tab === 'cal' ? renderCal() : h('div', { class: 'feed' }, renderFeed())];
  const a = document.activeElement, fk = focusKey || (a && a.dataset && a.dataset.f); // keep keyboard focus across re-renders
  if (PUPA && S.data) kids = [kids, footer()];
  $main.replaceChildren(...[kids].flat(Infinity).filter(x => x != null && x !== false));
  if (fk) { const el = $main.querySelector(`[data-f="${CSS.escape(fk)}"]`); if (el) el.focus({ preventScroll: true }); }
}

// аватар и «пупа» в шапке — открывают «О пупе»
document.querySelectorAll('.brand .ava, .brand b').forEach(el => {
  el.classList.add('home'); el.setAttribute('role', 'button'); el.setAttribute('tabindex', '0'); el.setAttribute('title', 'О пупе');
  const open = () => { S.tab = PUPA ? 'src' : 'about'; S.cat = null; render(); window.scrollTo(0, 0); };
  el.addEventListener('click', open);
  el.addEventListener('keydown', ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); open(); } });
});
document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => {
  S.tab = b.dataset.tab; S.cat = null; render(); window.scrollTo(0, 0);
}));
document.addEventListener('keydown', ev => {
  if (S.tab !== 'cal' || !S.data || ev.altKey || ev.ctrlKey || ev.metaKey || ev.shiftKey) return;
  if (ev.key !== 'ArrowLeft' && ev.key !== 'ArrowRight') return;
  if (ev.target && /^(INPUT|TEXTAREA|SELECT)$/.test(ev.target.tagName)) return;
  const d = pd(S.sel);
  d.setDate(d.getDate() + (ev.key === 'ArrowRight' ? 1 : -1));
  const ds = iso(d), [lo, hi] = calRange();
  if (ds < lo || ds > hi) return;
  ev.preventDefault();
  S.sel = ds; render();
  const el = $main.querySelector(`[data-f="${CSS.escape('day:' + ds)}"]`);
  if (el) el.focus({ preventScroll: true }), el.scrollIntoView({ block: 'nearest' });
});
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && !DEMO) load(true);
});
